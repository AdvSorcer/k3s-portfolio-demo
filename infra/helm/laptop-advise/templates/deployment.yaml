apiVersion: v1
kind: Service
metadata:
  name: {{ include "laptop-advise.fullname" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "laptop-advise.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laptop-advise.fullname" . }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "laptop-advise.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "laptop-advise.fullname" . }}
    spec:
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: laptop-advise
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "laptop-advise.fullname" . }}-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.laravel.secretName }}
                  key: {{ .Values.laravel.appKeySecretKey }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.laravel.secretName }}
                  key: {{ .Values.laravel.dbPasswordSecretKey }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
