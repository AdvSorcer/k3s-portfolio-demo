apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "laptop-advise.fullname" . }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.app.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "laptop-advise.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
